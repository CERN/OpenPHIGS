name: OpenPHIGS build CI on Ubuntu

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
          contents: read

jobs:
  build:

    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm/v6
          - linux/arm/v7
          - linux/arm64
        asan: [ON, OFF]

    steps:
    - uses: actions/checkout@v4

    - name: dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --fix-missing cmake gcc gfortran libx11-dev libglu1-mesa-dev libmotif-dev tcsh libxaw7-dev libglew-dev libdlm-dev libgl2ps-dev libpng-dev

    - name: clean
      run: make clean

    - name: configure
      run: make config OPENPHIGS_OPTS="-DUSE_ASAN=${{ matrix.asan }}"

    - name: Build
      run: make build

    - name: Install test
      run: make install
